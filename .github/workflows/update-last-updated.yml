name: Update Last Updated Timestamp

on:
  push:
    branches:
      - main
  workflow_dispatch: # 允许手动触发

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current UTC time
        id: date
        run: echo "now=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Update README with timestamp
        run: |
          # 显示当前时间
          echo "Current UTC time: ${{ steps.date.outputs.now }}"
          # 使用 Python 来更新，更可靠
          python3 << EOF
          import re
          
          timestamp = "${{ steps.date.outputs.now }}"
          
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # 匹配注释标记中的时间戳 <!-- LAST_UPDATE -->时间戳<!-- /LAST_UPDATE -->
          pattern = r'<!-- LAST_UPDATE -->\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} UTC<!-- /LAST_UPDATE -->'
          replacement = f'<!-- LAST_UPDATE -->{timestamp}<!-- /LAST_UPDATE -->'
          
          new_content = re.sub(pattern, replacement, content)
          
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
          
          print("Updated README.md with new timestamp")
          EOF

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update Last Updated timestamp"
            git push
          fi

